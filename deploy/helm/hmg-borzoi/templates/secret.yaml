{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hmg-borzoi.secretName" . }}
  labels:
    {{- include "hmg-borzoi.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "hmg-borzoi.databaseUrl" . | quote }}
  encryption-key: {{ required "secret.encryptionKey is required (generate with: openssl rand -hex 32) or set secret.existingSecret" .Values.secret.encryptionKey | quote }}
  oidc-client-secret: {{ .Values.secret.oidcClientSecret | quote }}
{{- end }}
