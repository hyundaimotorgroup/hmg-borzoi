{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hmg-borzoi.postgresql.secretName" . }}
  labels:
    {{- include "hmg-borzoi.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  postgres-user: {{ .Values.postgresql.auth.username | quote }}
  postgres-password: {{ required "postgresql.auth.password is required when postgresql.enabled=true" .Values.postgresql.auth.password | quote }}
{{- end }}
