version: '3.8'

# Production deployment — app + PostgreSQL on a single host.
# Copy .env.local.example to .env.prod and fill in values before running.
#
# Usage:
#   docker compose -f deploy/docker/docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: borzoi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: borzoi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borzoi_user -d borzoi"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${JOB_IMAGE}
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  app:
    image: ${APP_IMAGE}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
      NEXT_PUBLIC_USE_MOCK: "false"
      NEXT_PUBLIC_API_URL: "/api"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
